<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/patientstyle.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Top Navigation -->
    <div class="top-nav">

        <!-- Top right: Patient Dashboard -->
        <div class="dashboard-title">
            Patient Dashboard
        </div>

                <!-- Top left navigation links -->
        <div class="nav-links">
            <a href="/pro/">Profile Management</a>
            <a href="/bystanders_request/">Request Bystander</a>
            <a href="#">Request Status</a>
            <a href="#">Past Requests</a>
            <a href="/medhis/">Medical History</a>
            <a href="#">Payments</a>
            <a href="#">Feedback</a>
        </div>

    </div>

    <!-- Logged-in user info and dropdown -->
    <div class="user-info">
        <span>{{ user.email }}</span>
        <div class="dropdown">
            <button class="dropbtn">▼</button>
            <div class="dropdown-content">
                <a href="{% url 'logout' %}">Logout</a>
            </div>
        </div>
    </div>

    <!-- Center Content: Greeting the patient -->
    <div class="welcome-message">
        <h1>Hi, {{ user.name }}</h1>
    </div>
</body>
</html>
