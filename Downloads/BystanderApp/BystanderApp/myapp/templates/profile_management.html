<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management</title>
    <link rel="stylesheet" href="{% static 'css/pro.css' %}">
</head>
<body>
    <div class="back-button-container">
        <a href="{% url 'patient_dashboard' %}" class="back-button">
            <img src="{% static 'icons/back-icon.png' %}" alt="Back">
        </a>
    </div>
    <!-- Profile Management Container -->
    <div class="profile-container">
        <h1>Profile Management</h1>
        <form method="post">
            {% csrf_token %}
            <!-- Name -->
            <div class="input-container">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" value="{{ user.name }}" required>
            </div>

            <!-- Email -->
            <div class="input-container">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required readonly>
            </div>

            <!-- Phone -->
            <div class="input-container">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" value="{{ user.phone }}" required>
            </div>

            <!-- Address -->
            <div class="input-container">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" value="{{ user.address }}" required>
            </div>

            <!-- City -->
            <div class="input-container">
                <label for="city">City:</label>
                <input type="text" id="city" name="city" value="{{ user.city }}" required>
            </div>

            <!-- State -->
            <div class="input-container">
                <label for="state">State:</label>
                <select id="state" name="state" required>
                    <option value="">Select State</option>
                    <option value="Kerala" {% if user.state == "Kerala" %}selected{% endif %}>Kerala</option>
                    <option value="Karnataka" {% if user.state == "Karnataka" %}selected{% endif %}>Karnataka</option>
                    <option value="Goa" {% if user.state == "Goa" %}selected{% endif %}>Goa</option>
                    <!-- Add other states similarly -->
                </select>
            </div>
            

            <!-- Gender -->
            <div class="input-container">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <!-- Update Button -->
            <button type="submit">Update</button>
        </form>
    </div>
</body>
</html>
